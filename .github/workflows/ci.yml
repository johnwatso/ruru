name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ruru supports macOS 15 Sequoia; build and test on it.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      - name: Test
        run: >
          xcodebuild -project Ruru.xcodeproj -scheme Ruru
          -derivedDataPath build/DerivedData
          -destination 'platform=macOS'
          test

      - name: Test RuruClient package
        run: swift test --package-path Clients/RuruClient

      - name: Test lease example expiry
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Clients/examples/tests -v

      - name: Build universal Release
        run: >
          xcodebuild -project Ruru.xcodeproj -scheme Ruru -configuration Release
          -derivedDataPath build/DerivedData
          -destination 'generic/platform=macOS'
          build

      - name: Verify all bundled architectures, Sequoia compatibility and update configuration
        run: >
          swift Scripts/validate_release.swift
          build/DerivedData/Build/Products/Release/Ruru.app --allow-unconfigured
